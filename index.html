<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101b1d" />
    <meta
      name="description"
      content="A proper ledger for friendly wagers. Agree on the terms, settle the score, and keep every lobster roll accounted for."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>The Lobster Ledger — Friendly wagers. Properly kept.</title>
    <noscript>
      <style>
        .no-js {
          box-sizing: border-box;
          min-height: 100vh;
          display: grid;
          place-content: center;
          gap: 12px;
          padding: 32px 24px;
          background: #f7f8f5;
          color: #34494a;
          font:
            15px/1.65 system-ui,
            -apple-system,
            'Segoe UI',
            sans-serif;
          text-align: center;
        }
        .no-js h1 {
          margin: 0;
          color: #153b3e;
          font:
            400 28px/1.2 Georgia,
            serif;
        }
        .no-js p {
          max-width: 36ch;
          margin: 0 auto;
        }
        @media (prefers-color-scheme: dark) {
          .no-js {
            background: #101b1d;
            color: #d2dedb;
          }
          .no-js h1 {
            color: #edf5f1;
          }
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main class="no-js">
        <h1>The Lobster Ledger needs JavaScript.</h1>
        <p>
          Turn JavaScript on in your browser settings, then reload this page to open the ledger.
        </p>
      </main>
    </noscript>
    <script>
      // Same rule as App.tsx: a stored choice wins, then an explicit light OS setting, else dark.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('lobster-ledger-theme');
        } catch (error) {
          // Without storage the page follows the OS setting.
        }
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.dataset.theme = theme;
        if (theme === 'light')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f8f5');
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
