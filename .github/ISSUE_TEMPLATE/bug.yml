name: Bug report
description: Report something that behaved differently than expected.
body:
  - type: markdown
    attributes:
      value: Use fictional wagers and members. For a security issue, follow SECURITY.md to contact a maintainer privately.
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the steps, what you expected, and what happened.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Where did it happen?
      description: Include the browser or CLI version and whether you used the hosted demo, local development, or a self-hosted ledger.
